name: Keep Supabase awake

# Supabase's free plan pauses a project after 7 days without activity.
# A tiny read every 3 days keeps it running. Needs the repository variables
# VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository variables to keep Supabase awake."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${URL%/}/rest/v1/items?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered HTTP $code"
          if [ "$code" -ge 400 ]; then
            echo "::error::Supabase did not answer normally (HTTP $code). The project may be paused: open supabase.com/dashboard and restore it."
            exit 1
          fi
